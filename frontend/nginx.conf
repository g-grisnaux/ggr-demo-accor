server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The BFF is proxied same-origin so RUM and APM share a trace context
    # without CORS preflights getting in the way.
    location /graphql {
        proxy_pass http://graphql-bff:8080/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://graphql-bff:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
