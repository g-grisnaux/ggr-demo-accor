apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: ggr-demo-accor
  labels:
    app: payment-api
    tags.datadoghq.com/env: "ggr-demo-accor-260907"
    tags.datadoghq.com/service: "payment-api"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        tags.datadoghq.com/env: "ggr-demo-accor-260907"
        tags.datadoghq.com/service: "payment-api"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/payment-api.logs: '[{"source":"nodejs","service":"payment-api"}]'
    spec:
      containers:
        - name: payment-api
          image: ggr-demo-accor/payment-api:latest
          # Always, not IfNotPresent: the images are published under a mutable
          # :latest tag, so IfNotPresent makes a node serve whatever it cached
          # first and silently ignore a rebuild. That is how a fixed image kept
          # crashlooping with the old binary still in the node cache.
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: DD_SERVICE
              value: "payment-api"
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_PROPAGATION_STYLE
              value: "datadog,tracecontext"
            - name: PORT
              value: "8083"
            - name: DD_DBM_PROPAGATION_MODE
              value: "full"
            - name: PAYMENT_DECLINE_RATE
              value: "0.04"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
