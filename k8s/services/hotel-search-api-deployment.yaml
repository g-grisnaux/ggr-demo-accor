apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-search-api
  namespace: ggr-demo-accor
  labels:
    app: hotel-search-api
    tags.datadoghq.com/env: "ggr-demo-accor-260907"
    tags.datadoghq.com/service: "hotel-search-api"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-search-api
  template:
    metadata:
      labels:
        app: hotel-search-api
        tags.datadoghq.com/env: "ggr-demo-accor-260907"
        tags.datadoghq.com/service: "hotel-search-api"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/hotel-search-api.logs: '[{"source":"java","service":"hotel-search-api"}]'
    spec:
      containers:
        - name: hotel-search-api
          image: ggr-demo-accor/hotel-search-api:latest
          # Always, not IfNotPresent: the images are published under a mutable
          # :latest tag, so IfNotPresent makes a node serve whatever it cached
          # first and silently ignore a rebuild. That is how a fixed image kept
          # crashlooping with the old binary still in the node cache.
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DD_SERVICE
              value: "hotel-search-api"
            - name: DD_GIT_REPOSITORY_URL
              value: "__GIT_REPOSITORY_URL__"
            - name: DD_GIT_COMMIT_SHA
              value: "__GIT_COMMIT_SHA__"
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_PROPAGATION_STYLE
              value: "datadog,tracecontext"
            - name: PORT
              value: "8081"
            - name: DD_DBM_PROPAGATION_MODE
              value: "full"
            - name: HOTEL_SEARCH_SLOW_MODE
              value: "false"
            - name: HOTEL_SEARCH_EXPENSIVE_RANKING
              value: "false"
            - name: HOTEL_SEARCH_RANKING_PASSES
              value: "60000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: jdbc-url
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
