apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ggr-demo-accor-ingress
  namespace: ggr-demo-accor
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: graphql-bff
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
