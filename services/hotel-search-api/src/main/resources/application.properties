server.port=${PORT:8081}
spring.application.name=${DD_SERVICE:hotel-search-api}
management.endpoints.web.exposure.include=health

# The BFF's mappers expect snake_case from every downstream REST API.
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgresql:5432/accor}
spring.datasource.username=${DATABASE_USER:accor}
spring.datasource.password=${DATABASE_PASSWORD:accor}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
